services:
  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    # Substituído pela leitura direta do .env, muito mais limpo!
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  mosquito:
    image: eclipse-mosquitto:latest
    container_name: mosquito
    ports:
      - "1883:1883"
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${MQTT_USERNAME:?MQTT_USERNAME is required}"
        : "$${MQTT_PASSWORD:?MQTT_PASSWORD is required}"
        : "$${MQTT_DEVICE_ID:?MQTT_DEVICE_ID is required}"
        : "$${MQTT_DEVICE_PASSWORD:?MQTT_DEVICE_PASSWORD is required}"
        case "$$MQTT_USERNAME" in *[!A-Za-z0-9_-]*|'') echo "invalid MQTT_USERNAME" >&2; exit 1;; esac
        case "$$MQTT_DEVICE_ID" in *[!A-Za-z0-9_-]*|'') echo "invalid MQTT_DEVICE_ID" >&2; exit 1;; esac
        case "$$MQTT_DEVICE_ID" in [A-Za-z0-9]*) ;; *) echo "MQTT_DEVICE_ID must start with a letter or digit" >&2; exit 1;; esac
        [ "$${#MQTT_DEVICE_ID}" -le 64 ] || { echo "MQTT_DEVICE_ID must contain at most 64 characters" >&2; exit 1; }
        [ "$${#MQTT_PASSWORD}" -ge 16 ] || { echo "MQTT_PASSWORD must contain at least 16 characters" >&2; exit 1; }
        [ "$${#MQTT_DEVICE_PASSWORD}" -ge 16 ] || { echo "MQTT_DEVICE_PASSWORD must contain at least 16 characters" >&2; exit 1; }
        [ "$$MQTT_USERNAME" != "$$MQTT_DEVICE_ID" ] || { echo "MQTT usernames must be unique" >&2; exit 1; }
        mosquitto_passwd -b -c /tmp/mosquitto-passwords "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        mosquitto_passwd -b /tmp/mosquitto-passwords "$$MQTT_DEVICE_ID" "$$MQTT_DEVICE_PASSWORD"
        printf 'user %s\ntopic read soiltune/telemetry/#\ntopic write soiltune/commands/#\n\npattern write soiltune/telemetry/%%u\npattern read soiltune/commands/%%u\n' "$$MQTT_USERNAME" > /tmp/mosquitto-acl
        chown root:mosquitto /tmp/mosquitto-passwords /tmp/mosquitto-acl
        chmod 0640 /tmp/mosquitto-passwords /tmp/mosquitto-acl
        exec /docker-entrypoint.sh mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./internal/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t soiltune/commands/healthcheck -m \"\" -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    build: 
      context: .
      dockerfile: Dockerfile
      target: consumer
    container_name: consumer
    env_file:
      - .env
    depends_on:
      influxdb:
        condition: service_healthy
      mosquito:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: 
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: api
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      mosquito:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://localhost:$${API_PORT:-8000}/health/ready\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
  mosquitto_data:
networks:
  default:
    name: iot_network
